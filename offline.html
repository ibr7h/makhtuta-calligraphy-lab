<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#78350F">
  <title>مخطوطة — دون اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F3E9;color:#3D3425;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
    .card{max-width:520px;text-align:center;background:#fff;padding:32px;border:1px solid #E2D5B7;border-radius:28px;box-shadow:0 14px 40px #78350f14}
    .icon{font-size:52px}.btn{display:inline-block;margin-top:18px;border:0;border-radius:14px;background:#78350F;color:#fff;padding:12px 18px;font-weight:700;font-size:15px}
    p{line-height:1.8;color:#57534e}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✒️</div>
    <h1>مخطوطة</h1>
    <p>لا يوجد اتصال بالإنترنت الآن. إذا سبق لك فتح التطبيق، فارجع وحاول فتح الصفحة الرئيسية؛ ستعمل الأجزاء المحفوظة محليًا.</p>
    <button class="btn" onclick="location.href='./'">العودة إلى التطبيق</button>
  </main>
</body>
</html>
